<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header id="app-header">
      <a href="./" id="app-logo" aria-label="Todo List home">
        <span aria-hidden="true">✓</span>
        <span>Todo List</span>
      </a>
    </header>

    <main id="main-content">
      <section id="todo-section" aria-labelledby="page-heading">
        <div id="intro">
          <h1 id="page-heading">Get things done!</h1>
          <p>Add a task and stay productive.</p>
          <button type="button" id="open-add-task-button">
            Add Task
          </button>
        </div>

        <nav id="task-filters" aria-label="Task filters">
          <button type="button" id="filter-all" data-filter="all" aria-pressed="true">
            All
          </button>
          <button type="button" id="filter-active" data-filter="active" aria-pressed="false">
            Active
          </button>
          <button type="button" id="filter-completed" data-filter="completed" aria-pressed="false">
            Completed
          </button>
        </nav>

        <p id="empty-state">No tasks yet. Add your first task!</p>
        <ul id="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <div
      id="add-task-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="add-task-modal-heading"
      hidden
    >
      <div>
        <button type="button" id="close-add-task-modal" aria-label="Close Add Task modal">
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 id="add-task-modal-heading">Add New Task</h2>
        <form id="add-task-form">
          <label for="task-description">Task description</label>
          <input
            type="text"
            id="task-description"
            name="task-description"
            placeholder="What needs to be done?"
            required
          />
          <div>
            <button type="button" id="cancel-add-task">Cancel</button>
            <button type="submit" id="submit-add-task">Add Task</button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="delete-task-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-task-modal-heading"
      aria-describedby="delete-task-modal-message"
      hidden
    >
      <div>
        <button
          type="button"
          id="close-delete-task-modal"
          aria-label="Close Delete Task modal"
        >
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 id="delete-task-modal-heading">Delete Task?</h2>
        <p id="delete-task-modal-message">
          Are you sure you want to delete this task?
        </p>
        <div>
          <button type="button" id="cancel-delete-task">Cancel</button>
          <button type="button" id="confirm-delete-task">Delete</button>
        </div>
      </div>
    </div>

    <script src="src/script.js"></script>
  </body>
</html>
